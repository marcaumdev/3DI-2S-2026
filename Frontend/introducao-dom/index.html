<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula de DOM</title>
    <style>
        .destaque {
            background-color: yellow;
            color: black;
            padding: 20px;
        }
    </style>
</head>
<body>

    <h1 id="titulo">Aula de DOM</h1>
    <p id="descricao">Aprendendo a manipular elementos com JavaScript</p>

    <p class="mensagem">Primeira mensagem</p>
    <p class="mensagem">Segunda mensagem</p>

    <button id="botao" onclick="mostrarMensagem()">Alterar Página</button>
    <button onclick="alternarDestaque()">Destacar Título</button>
    

    <input id="nome" type="text" placeholder="Digite seu nome">

    <button onclick="mostrarNome()">Mostrar Nome</button>

    <p id="resultado"></p>

    <button onclick="trocarImagem()">Trocar Imagem</button>

    <img id="imagem" style="width: 300px;" src="https://cidadedesaopaulo.com/wp-content/uploads/2024/04/cidadedesaopaulo.com-primeiro-restaurante-tematico-do-bob-esponja-no-mundo-chega-a-sao-paulo-bob-esponja-divulgacao-1024x575.jpeg" alt="Bob esponja">

    <a id="link" href="https://www.google.com">Abrir site</a>

    <button onclick="adicionarParagrafo()">Adicionar Paragrafo</button>
    <div id="conteudo"></div>

    <ul id="lista"></ul>

    <p id="aviso">Este aviso pode ser removido.</p>
    <button onclick="removerAviso()"> Remover aviso</button>

    <script src="script.js"></script>
</body>
</html>
